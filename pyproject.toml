[tool.ruff]
exclude = [".venv", "build", "dist", ".git", "__pycache__"]

# For compatibility with the Ruff version in CI, configure line length via pycodestyle.
[tool.ruff.pycodestyle]
max-line-length = 88

[tool.ruff.lint]
per-file-ignores = { "tests/*" = ["D", "T"] }

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
strict = false
# Run mypy over the whole repo (adjust later to a package path if you create one)
files = ["."]
follow_imports = "skip"
# Allow implicit optional types to be permissive during migration
no_implicit_optional = false

                                                                                                                                                                                                                        <!-- Undo toast (ARIA polite) -->
                                                                                                                                                                                                                                                                                                <style>

                                                                                                                                                                                                                                                                                                    /* slide-in/out */

                                                                                                                                                                                                                                                                                                    .toast-leave{ animation: slideOut .22s cubic-bezier(.2,.9,.2,1) both }
                                                                                                                                                                                                                                                                                                </style>
                                                                                                                                                                                                                        <div id="toastContainer">
                                                                                                                                                                                                                            <div id="undoToast" class="toast align-items-center text-bg-dark" role="status" aria-live="polite" aria-atomic="true">

                                                                                                                                                                                                                                    <span class="icon-wrap" aria-hidden="true"><img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='20' height='20' viewBox='0 0 24 24' fill='none' stroke='%23fff' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'><path d='M21 10c0 6-9 13-9 13S3 16 3 10a9 9 0 1 1 18 0z'></path><circle cx='12' cy='10' r='3'></circle></svg>" alt="logo" style="height:20px;width:20px;opacity:0.95"/></span>
                                                                                                                                                                                                                                    <span class="toast-message">Action performed</span>
                                                                                                                                                                                                                                </div>
                                                                                                                                                                                                                                    <div style="display:flex;align-items:center;gap:8px;padding-right:.6rem">
                                                                                                                                                                                                                                        <button type="button" class="btn btn-sm btn-primary undo-action" style="padding:.35rem .6rem">Undo</button>
                                                                                                                                                                                                                                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="toast" aria-label="Close"></button>
                                                                                                                                                                                                                                    </div>

                                    <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.3/dist/leaflet.js"></script>
                                    <script>
                                        (function(){
                                            // mutable stops dataset used by the UI
                                            let stopsData = [
                                                {id:1, lat:32.257254, lon:-110.9723225, label:'Stop A'},
                                                {id:2, lat:32.1162014, lon:-111.0419424, label:'Stop B'},
                                                {id:3, lat:32.4078759, lon:-111.0204164, label:'Stop C'},
                                                {id:4, lat:32.2753731, lon:-110.9443301, label:'Stop D'},
                                            ];

                                            const colors = ['#e4572e','#2a9d8f','#2b5dff','#f4a261','#6a4c93','#ff6b6b','#1982c4','#4caf50'];

                                            const map = L.map('map', {center:[32.257254, -110.9723225], zoom:11});
                                            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19}).addTo(map);
                                            const layer = L.featureGroup().addTo(map);

                                            function renderStops(stops){
                                                layer.clearLayers();
                                                const tbody = document.getElementById('stopsBody'); tbody.innerHTML = '';
                                                stops.forEach((s,i)=>{
                                                    const icon = L.divIcon({className:'', html:`<div style="background:${colors[i%colors.length]};color:#fff;border-radius:10px;padding:3px 6px;font-weight:700">${i+1}</div>`, iconSize:[28,28]});
                                                    const m = L.marker([s.lat, s.lon], {icon}).addTo(layer);
                                                    // include a delete link in the marker popup
                                                    m.bindPopup(`<b>${s.label || s.id}</b><br>${s.lat.toFixed(6)}, ${s.lon.toFixed(6)}<br><a href="#" data-id="${s.id}" class="popup-delete">Delete</a>`);
                                                    const tr = document.createElement('tr');
                                                    tr.innerHTML = `<td><span class="num-badge" style="background:${colors[i%colors.length]}">${i+1}</span></td><td style="word-break:break-word">${s.label || s.id}</td><td>${s.lat.toFixed(6)}, ${s.lon.toFixed(6)}</td><td><button class="btn btn-sm btn-outline-danger delete-btn" data-id="${s.id}" aria-label="Delete ${s.label||s.id}">Delete</button></td>`;
                                                    // row click zooms
                                                    tr.querySelector('td').addEventListener('click', ()=>{ map.setView([s.lat, s.lon], 15); if(m.openPopup) m.openPopup(); });
                                                    // delete button
                                                    const delBtn = tr.querySelector('.delete-btn');
                                                    delBtn.addEventListener('click', (ev)=>{
                                                        ev.stopPropagation();
                                                        const id = ev.currentTarget.dataset.id;
                                                        showConfirm('Delete stop', `Delete "${s.label||s.id}"? This action cannot be undone.`, ()=>{
                                                            const idx = stopsData.findIndex(x=>String(x.id)===String(id));
                                                            if(idx!==-1){ const removed = stopsData.splice(idx,1); renderStops(stopsData); pushUndo({type:'delete', data: removed}); announce(`${s.label||s.id} deleted`); }
                                                        }, {primary:'ok', relatedTarget: ev.currentTarget});
                                                    });
                                                    tbody.appendChild(tr);
                                                });
                                                // bind popup delete links (delegated)
                                                layer.eachLayer(l=>{ if(l.getPopup){ const p = l.getPopup(); if(p){ p.on('add', ()=>{ const el = p.getElement(); if(!el) return; const a = el.querySelector('.popup-delete'); if(a){ a.addEventListener('click', (ev)=>{ ev.preventDefault(); const id = ev.currentTarget.dataset.id; const s = stopsData.find(x=>String(x.id)===String(id)); if(s){ showConfirm('Delete stop', `Delete "${s.label||s.id}"? This action cannot be undone.`, ()=>{ const idx = stopsData.findIndex(x=>String(x.id)===String(id)); if(idx!==-1){ const removed = stopsData.splice(idx,1); renderStops(stopsData); pushUndo({type:'delete', data: removed}); announce(`${s.label||s.id} deleted`); } }, {primary:'ok', relatedTarget: el}); } }); } }); } } });
                                                if(stops.length) map.fitBounds(layer.getBounds().pad(0.08));
                                            }

                                            renderStops(stopsData);

                                            // controls
                                            document.getElementById('fitBtn').addEventListener('click', ()=>{ if(layer.getLayers().length) map.fitBounds(layer.getBounds().pad(0.08)); });
                                            document.getElementById('fitBoundsBtn').addEventListener('click', ()=>{ if(layer.getLayers().length) map.fitBounds(layer.getBounds().pad(0.08)); });
                                            document.getElementById('locateBtn').addEventListener('click', ()=> map.locate({setView:true, maxZoom:14}));
                                            document.getElementById('locateBtn2').addEventListener('click', ()=> map.locate({setView:true, maxZoom:14}));

                                            map.on('locationfound', function(e){ const c = L.circle(e.latlng,{radius:Math.max(e.accuracy,25),color:'#2a9d8f',fillOpacity:0.12}).addTo(map); setTimeout(()=>map.removeLayer(c),4000); });

                                            // search
                                            document.getElementById('search').addEventListener('input', (ev)=>{
                                                const q = ev.target.value.toLowerCase();
                                                document.querySelectorAll('#stopsBody tr').forEach(tr=>{ tr.style.display = (q==='' || tr.textContent.toLowerCase().indexOf(q)!==-1) ? '' : 'none'; });
                                            });

                                            // sync live toggles
                                            const liveA = document.getElementById('liveToggle');
                                            const liveB = document.getElementById('liveToggle2');
                                            function setLiveChecked(v){ liveA.checked = v; liveB.checked = v; }

                                            // live polling
                                            let liveInterval = null;
                                            async function pollLive(){
                                                try{
                                                    const resp = await fetch('/api/live_status');
                                                    if(!resp.ok) return;
                                                    const data = await resp.json();
                                                    if(data && data.ok){
                                                        const stops = (data.trips || []).map((t,i)=>({id:t.id||i, lat:t.lat, lon:t.lon, label:t.label||t.id}));
                                                        renderStops(stops);
                                                        const lg = document.getElementById('legend'); lg.innerHTML = '';
                                                        (data.drivers || []).forEach((d,i)=>{ const div = document.createElement('div'); div.className='legend-item'; div.innerHTML = `<div style="width:12px;height:12px;background:${colors[i%colors.length]};border-radius:3px"></div><div style="font-size:13px">${d.id||('drv'+(i+1))}</div>`; lg.appendChild(div); });
                                                    }
                                                }catch(e){ console.warn('live poll failed', e) }
                                            }

                                            function startLive(){ if(liveInterval) return; pollLive(); liveInterval = setInterval(pollLive, 5000); setLiveChecked(true); }
                                            function stopLive(){ if(liveInterval){ clearInterval(liveInterval); liveInterval = null } setLiveChecked(false); }

                                            liveA.addEventListener('change', (ev)=>{ if(ev.target.checked) startLive(); else stopLive(); });
                                            liveB.addEventListener('change', (ev)=>{ if(ev.target.checked) startLive(); else stopLive(); });

                                            // Reusable confirmation helper using Bootstrap modal
                                            // options: { primary: 'ok'|'cancel', relatedTarget: HTMLElement }
                                            function showConfirm(title, message, onConfirm, options){
                                                const titleEl = document.getElementById('confirmModalTitle');
                                                const bodyEl = document.getElementById('confirmModalBody');
                                                const okBtn = document.getElementById('confirmModalOk');
                                                const cancelBtn = document.getElementById('confirmModalCancel');
                                                const modalEl = document.getElementById('confirmModal');
                                                titleEl.textContent = title || 'Confirm';
                                                bodyEl.textContent = message || '';

                                                options = options || {};
                                                const primary = options.primary || 'cancel';

                                                // Remember focus so we can restore
                                                const lastActive = options.relatedTarget || document.activeElement;

                                                // Remove previous OK handler by replacing the node (clean slate)
                                                okBtn.replaceWith(okBtn.cloneNode(true));
                                                const newOk = document.getElementById('confirmModalOk');

                                                // Create modal and allow keyboard (Escape) to close it
                                                const bsModal = new bootstrap.Modal(modalEl, {backdrop:'static', keyboard:true});

                                                function cleanupAndMaybeCallback(){
                                                    try{ if(typeof onConfirm === 'function') onConfirm(); }catch(e){ console.error('onConfirm error', e); }
                                                }

                                                // attach handler for OK
                                                newOk.addEventListener('click', ()=>{
                                                    bsModal.hide();
                                                    cleanupAndMaybeCallback();
                                                });

                                                // When modal shown, move focus to primary button (ok) or cancel
                                                modalEl.addEventListener('shown.bs.modal', function onShown(){
                                                    try{
                                                        if(primary==='ok') newOk.focus(); else cancelBtn.focus();
                                                    }catch(e){}
                                                    modalEl.removeEventListener('shown.bs.modal', onShown);
                                                });

                                                // When modal hidden, restore focus to previous element
                                                modalEl.addEventListener('hidden.bs.modal', function onHidden(){
                                                    try{ if(lastActive && typeof lastActive.focus === 'function') lastActive.focus(); }catch(e){}
                                                    modalEl.removeEventListener('hidden.bs.modal', onHidden);
                                                });

                                                bsModal.show();
                                                return bsModal;
                                            }

                                            // ARIA polite live region for status announcements
                                            function announce(msg){
                                                let el = document.getElementById('ariaStatus');
                                                if(!el){ el = document.createElement('div'); el.id='ariaStatus'; el.setAttribute('aria-live','polite'); el.setAttribute('aria-atomic','true'); el.style.position='absolute'; el.style.left='-9999px'; el.style.height='1px'; el.style.overflow='hidden'; document.body.appendChild(el); }
                                                el.textContent = msg;
                                                // clear after a short while so repeated messages will be re-read
                                                setTimeout(()=>{ if(el.textContent===msg) el.textContent = ''; }, 3000);
                                            }

                                            // wire clear button to confirmation
                                            // Undo stack (client-side) for quick restore
                                            const undoStack = [];
                                            const toastEl = document.getElementById('undoToast');
                                            const bsToast = new bootstrap.Toast(toastEl, { delay: 6000 });

                                            function pushUndo(action){
                                                // action: {type:'delete'|'clear', data: [...]}
                                                undoStack.push(action);
                                                showUndoToast(action);
                                            }

                                            function showUndoToast(action){
                                                const msgEl = toastEl.querySelector('.toast-message');
                                                const undoBtn = toastEl.querySelector('.undo-action');
                                                msgEl.textContent = action.type === 'clear' ? 'Cleared stops' : (action.type==='delete' ? `Deleted ${action.data && action.data[0] && action.data[0].label ? action.data[0].label : 'stop'}` : 'Action performed');
                                                // replace undo button to remove old listeners
                                                const newUndo = undoBtn.cloneNode(true);
                                                undoBtn.replaceWith(newUndo);
                                                newUndo.addEventListener('click', ()=>{
                                                    const a = undoStack.pop();
                                                    if(!a) return;
                                                    if(a.type === 'delete'){
                                                        // restore single item
                                                        stopsData.push(...a.data);
                                                        renderStops(stopsData);
                                                        announce('Undo: item restored');
                                                    } else if(a.type === 'clear'){
                                                        stopsData = a.data.slice();
                                                        renderStops(stopsData);
                                                        announce('Undo: cleared stops restored');
                                                    }
                                                    // animate hide then actually hide
                                                    toastEl.classList.remove('toast-enter');
                                                    toastEl.classList.add('toast-leave');
                                                    setTimeout(()=>{ bsToast.hide(); toastEl.classList.remove('toast-leave'); }, 210);
                                                });
                                                // animate in
                                                toastEl.classList.remove('toast-leave');
                                                toastEl.classList.add('toast-enter');
                                                bsToast.show();
                                            }

                                            document.getElementById('clearBtn').addEventListener('click', ()=>{
                                                showConfirm('Clear all stops', 'This will remove all stops from the map. You can undo this for a short time.', ()=>{
                                                    // push previous state for undo
                                                    const snapshot = stopsData.slice();
                                                    stopsData = [];
                                                    renderStops(stopsData);
                                                    pushUndo({type:'clear', data: snapshot});
                                                    announce('All stops cleared');
                                                }, {primary:'cancel'});
                                            });

                                        })();
                                    </script>
                                </body>
                                </html>
